[pytest]
# 1. Tells pytest which folders contain your test files
testpaths = tests labs/raw_asgi

# 2. Tells pytest to only run files starting with "test_" (e.g. test_cursor.py)
python_files = test_*.py    
# 3. Default options added automatically to every run:
#    -v = verbose (shows test names and PASSED / FAILED clearly)
#    --ignore = skips test files that don't need to run
addopts = --ignore=tests/test_api.py --ignore=tests/test_feed.py --ignore=tests/test_models_cache.py -v
# 4. Enables automatic async support (so pytest can test FastAPI "async def" endpoints)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
