# ============================================================================
# Alembic Configuration for Social Feed Persistence (Stage C)
# Target Database: instagram_modeling
# ============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder URL - dynamically overridden in alembic/env.py from app.config.Settings
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/instagram_modeling

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
